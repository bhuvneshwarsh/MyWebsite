<p *ngIf="!authservice.loginInfo.isloggedin">You are not logged in. Please log in to view gallery. <a
        routerLink="/login">Click to login now</a></p>

<div *ngIf="authservice.loginInfo.isloggedin" class="gallery">
  <div class="gallery-item" *ngFor="let img of images; let i = index" (click)="openLightbox(i)">
    <img [src]="img.src" [alt]="img.alt" />
    <div class="desc">{{ img.desc }}</div>
  </div>
</div>

<!-- Lightbox Modal -->
<div *ngIf="authservice.loginInfo.isloggedin && lightboxOpen" class="lightbox" (click)="closeLightbox()">
  <button class="close-btn" (click)="closeLightbox(); $event.stopPropagation()">×</button>
  <img [src]="images[currentIndex].src" [alt]="images[currentIndex].alt" class="lightbox-img" />
  <button class="prev-btn" (click)="prevImage($event)">‹</button>
  <button class="next-btn" (click)="nextImage($event)">›</button>
</div>
