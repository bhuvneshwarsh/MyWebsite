<div class="feedback-container">
  <h2>Feedback Form</h2>
  <form (ngSubmit)="onSubmit()" #feedbackForm="ngForm" novalidate>
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required [(ngModel)]="feedback.name" #name="ngModel"
        placeholder="Your full name" />
        <div class="error" *ngIf="!isNameValid && name.touched">
          Name is required with minimum 3 characters.
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required email [(ngModel)]="feedback.email" #email="ngModel"
          placeholder="Your email address" />
        <div class="error" *ngIf="!isEmailValid && email.touched">
          Please enter a valid email.
        </div>
      </div>

      <div class="form-group">
        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5" required [(ngModel)]="feedback.comments" #comments="ngModel"
          placeholder="Write your comments here (min 50 characters)"></textarea>
        <div class="error" *ngIf="!isCommentsValid && comments.touched">
          Comments must be at least 50 characters long.
        </div>
      </div>

      <button type="submit" [disabled]="feedbackForm.invalid || !isNameValid || !isEmailValid || !isCommentsValid">Submit</button>

      <div class="success-message" *ngIf="submitted">
        Thank you for your feedback!
      </div>
  </form>
</div>
