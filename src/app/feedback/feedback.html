<div class="feedback-container">
  <h2>Feedback Form</h2>
  <form (ngSubmit)="onSubmit()" #feedbackForm="ngForm" novalidate>
    <div class="form-group">
      <label for="name">Name</label>
      <input
        type="text"
        id="name"
        name="name"
        required
        [(ngModel)]="feedback.name"
        #name="ngModel"
        placeholder="Your full name"
      />
      <div class="error" *ngIf="name.invalid && name.touched">
        Name is required.
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        email
        [(ngModel)]="feedback.email"
        #email="ngModel"
        placeholder="Your email address"
      />
      <div class="error" *ngIf="email.invalid && email.touched">
        Please enter a valid email.
      </div>
    </div>

    <div class="form-group">
      <label for="comments">Comments</label>
      <textarea
        id="comments"
        name="comments"
        rows="5"
        required
        [(ngModel)]="feedback.comments"
        #comments="ngModel"
        placeholder="Write your comments here"
      ></textarea>
      <div class="error" *ngIf="comments.invalid && comments.touched">
        Comments are required.
      </div>
    </div>

    <button type="submit" [disabled]="feedbackForm.invalid">Submit</button>

    <div class="success-message" *ngIf="submitted">
      Thank you for your feedback!
    </div>
  </form>
</div>
